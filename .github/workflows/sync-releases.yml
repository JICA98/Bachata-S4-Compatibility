name: Sync Bachata releases
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Synchronize release index
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: python3 scripts/sync_releases.py
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data/releases.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git commit -m "chore: sync Bachata S4 releases"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the app compatibility feed
        # The feed is scored against main's release index; rebuild it when a release changes.
        if: steps.commit.outputs.changed == 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run publish-app-feed.yml --repo "${{ github.repository }}" --ref feat/community-compatibility-v2
