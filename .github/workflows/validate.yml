name: Validate compatibility data
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Enforce immutable reports and evidence
        if: github.event_name == 'pull_request'
        run: scripts/check_immutable.sh "origin/${{ github.base_ref }}"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate source data
        run: python3 scripts/validate.py
      - name: Build website indexes
        run: python3 scripts/build_site_data.py --output generated
      - name: Build Android compatibility v2 feed
        run: python3 scripts/build_app_data.py --output generated/app-v2
      - name: Typecheck community submission worker
        id: worker_typecheck
        continue-on-error: true
        run: |
          npm install --prefix worker --ignore-scripts --no-package-lock
          set +e
          npm run --prefix worker typecheck > worker-typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat worker-typecheck.log
          exit $status
      - name: Upload Worker typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-typecheck-log
          path: worker-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail on Worker typecheck errors
        if: steps.worker_typecheck.outputs.status != '0'
        run: exit 1
      - name: Verify generated JSON
        run: |
          python3 -m json.tool generated/site-index.json >/dev/null
          python3 -m json.tool generated/app-v2/index.json >/dev/null
          python3 -m json.tool generated/app-v2/socs.json >/dev/null
          find generated/app-v2/games -name '*.json' -print0 | xargs -0 -r -n1 python3 -m json.tool >/dev/null
