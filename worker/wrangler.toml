name = "bachata-compatibility-submit"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
GITHUB_OWNER = "JICA98"
GITHUB_REPO = "Bachata-S4-Compatibility"
GITHUB_BASE_BRANCH = "feat/community-compatibility-v2"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d174f75cb8774e3fa945b20d05274a3c"

[images]
binding = "IMAGES"

[observability]
enabled = true

[observability.traces]
enabled = true

# Secrets required at deploy time (never commit them):
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put GITHUB_ISSUE_TOKEN
